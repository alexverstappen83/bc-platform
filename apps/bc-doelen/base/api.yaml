# Backend-API (compose 'api': image ./backend, command ["api"], poort 8000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/alexverstappen83/bc-doelen-backend:latest
          args: ["api"]
          envFrom:
            - configMapRef: { name: bc-doelen-config }
            - secretRef:    { name: bc-doelen-secrets }
          ports: [ { containerPort: 8000 } ]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [ { port: 8000, targetPort: 8000 } ]
