# Genereert automatisch een ArgoCD Application per app-overlay voor ONTWIKKEL en
# TEST-ACCEPTATIE. Elke map apps/<app>/overlays/{ontwikkel,test-acceptatie} wordt
# opgepikt -> nieuwe apps toevoegen = gewoon een overlay-map committen.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bc-apps-auto
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/alexverstappen83/bc-platform.git
        revision: claude/k3s-mac-mini-m4-b2dhrz
        directories:
          - path: apps/*/overlays/ontwikkel
          - path: apps/*/overlays/test-acceptatie
  template:
    metadata:
      # naam = <app>-<omgeving>, bijv. mijnapp-ontwikkel
      name: '{{index .path.segments 1}}-{{.path.basename}}'
    spec:
      project: bc-apps
      source:
        repoURL: https://github.com/alexverstappen83/bc-platform.git
        targetRevision: claude/k3s-mac-mini-m4-b2dhrz
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'   # overlay-mapnaam = namespace
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: ["CreateNamespace=false"]
