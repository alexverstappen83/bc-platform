# Genereert automatisch een ArgoCD Application per app-overlay voor ONTWIKKEL en
# TEST-ACCEPTATIE. Elke map apps/<app>/overlays/{ontwikkel,test-acceptatie} wordt
# opgepikt -> nieuwe apps toevoegen = gewoon een overlay-map committen.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bc-apps-auto
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/alexverstappen83/bc-platform.git
        revision: claude/k3s-mac-mini-m4-b2dhrz
        directories:
          - path: apps/*/overlays/ontwikkel
          - path: apps/*/overlays/test-acceptatie
  template:
    metadata:
      # naam = <app>-<omgeving>, bijv. mijnapp-ontwikkel
      name: '{{index .path.segments 1}}-{{.path.basename}}'
    spec:
      project: bc-apps
      source:
        repoURL: https://github.com/alexverstappen83/bc-platform.git
        targetRevision: claude/k3s-mac-mini-m4-b2dhrz
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'   # overlay-mapnaam = namespace
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: ["CreateNamespace=false"]
  # --- ArgoCD Image Updater: per-app annotaties, conditioneel ------------------
  # Alleen voor bc-doelen + ontwikkel: nieuwe ghcr-builds gaan automatisch live
  # (geen CI-writeback meer nodig). Image Updater schrijft de nieuwe tag terug
  # naar de overlay-kustomization via Git.
  # LET OP: dit is app-specifiek (bc-doelen heeft 2 images). Voeg je een 2e app
  # toe, breid dit blok dan uit met een eigen conditie (of stap over op een
  # per-app configbestand). Zonder conditie zou een andere app deze images erven.
  templatePatch: |
    {{- if and (eq (index .path.segments 1) "bc-doelen") (eq .path.basename "ontwikkel") }}
    metadata:
      annotations:
        argocd-image-updater.argoproj.io/image-list: "backend=ghcr.io/alexverstappen83/bc-doelen-backend,frontend=ghcr.io/alexverstappen83/bc-doelen-frontend"
        argocd-image-updater.argoproj.io/backend.update-strategy: newest-build
        argocd-image-updater.argoproj.io/frontend.update-strategy: newest-build
        argocd-image-updater.argoproj.io/backend.pull-secret: pullsecret:argocd/ghcr-creds
        argocd-image-updater.argoproj.io/frontend.pull-secret: pullsecret:argocd/ghcr-creds
        argocd-image-updater.argoproj.io/write-back-method: git
        argocd-image-updater.argoproj.io/write-back-target: kustomization
        argocd-image-updater.argoproj.io/git-branch: claude/k3s-mac-mini-m4-b2dhrz
    {{- end }}
